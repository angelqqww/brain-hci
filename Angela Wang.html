<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angela Wang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#070914; --dust:#1a1830; --ink:#ece8f4; --muted:#9a96b0; --faint:#5d5a76;
  --panel:rgba(14,15,30,.86); --line:rgba(236,232,244,.12);
  --c1:#ff7a8a; --c2:#5fe0c0; --c3:#b48cff; --c4:#6fb0ff;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.galaxy{position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 9% at 50% 50%, rgba(190,180,230,.10), transparent 70%),
    radial-gradient(ellipse 38% 4% at 46% 51%, rgba(255,230,240,.07), transparent 70%),
    radial-gradient(ellipse 80% 18% at 55% 49%, rgba(90,80,160,.10), transparent 70%);
  transform:rotate(-28deg)}
main{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(20px,4vw,44px)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4.4vw,3.2rem);margin:0;letter-spacing:-.01em;line-height:1}
.tag{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:clamp(1rem,1.6vw,1.2rem);margin:.4rem 0 0}
a{color:inherit}
.link{color:var(--muted);text-decoration:none;font-size:.9rem;border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .2s,border-color .2s}
.link:hover,.link:focus-visible{color:var(--ink);border-color:var(--ink)}

.stage{display:grid;place-items:center;padding:12px 0}
.brainwrap{position:relative;width:min(78vh,88vw,640px);aspect-ratio:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.brainwrap img{width:100%;height:100%;display:block;filter:saturate(.75) brightness(.82);transition:filter .5s;user-select:none;-webkit-user-drag:none}
.brainwrap.active img{filter:saturate(.5) brightness(.55)}
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s ease;
  -webkit-mask-image:var(--brain);mask-image:var(--brain);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.glow::before{content:"";position:absolute;inset:0;background-image:var(--brain);background-size:100% 100%;filter:grayscale(1) brightness(1.7) contrast(1.15);mix-blend-mode:normal}
.glow::after{content:"";position:absolute;inset:0;background:var(--c);mix-blend-mode:multiply}
.glow.on{opacity:1}
.halo{position:absolute;inset:8%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .5s,background .5s;filter:blur(60px);z-index:-1}
.brainwrap.active .halo{opacity:.35}

.label{position:absolute;left:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;transition:opacity .3s,top .3s;white-space:nowrap}
.label span{font-family:var(--serif);font-size:clamp(1.3rem,3vw,2.1rem);color:#fff;text-shadow:0 0 24px var(--c),0 2px 10px rgba(0,0,0,.9)}
.label small{display:block;font-size:.75rem;color:var(--ink);opacity:.75;margin-top:4px;text-shadow:0 1px 6px #000}
.label.on{opacity:1}

nav.regions{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin-top:6px}
nav.regions button{background:none;border:0;color:var(--faint);font:inherit;font-size:.88rem;cursor:pointer;padding:6px 2px;display:flex;align-items:center;gap:8px;transition:color .25s}
nav.regions button i{width:7px;height:7px;border-radius:50%;background:var(--c);opacity:.45;transition:opacity .25s,box-shadow .25s}
nav.regions button.on,nav.regions button:hover,nav.regions button:focus-visible{color:var(--ink)}
nav.regions button.on i,nav.regions button:hover i{opacity:1;box-shadow:0 0 10px var(--c)}
button:focus-visible,.link:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
footer{color:var(--faint);font-size:.78rem;text-align:center;padding-top:10px}

/* popup */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(4,5,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.open{opacity:1;pointer-events:auto}
.pop{position:fixed;z-index:11;left:50%;top:50%;width:min(620px,calc(100vw - 32px));max-height:min(80vh,780px);overflow:auto;
  transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:clamp(24px,4vw,40px);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 30px 80px -20px var(--glowc,transparent)}
.pop.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.pop::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--glowc)}
.close{position:sticky;top:0;float:right;margin:-10px -10px 0 0;background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;cursor:pointer;padding:6px 10px}
.close:hover{color:var(--ink)}
.kicker{font-size:.85rem;color:var(--glowc);margin:0 0 4px}
.pop h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,4vw,2.4rem);margin:0 0 22px;line-height:1.05}
.tabs{display:flex;flex-wrap:wrap;gap:4px 18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;color:var(--muted);font:inherit;font-size:.92rem;padding:8px 0;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--glowc)}
.panel p{line-height:1.65;margin:0 0 14px;color:#d6d2e2;max-width:62ch}
.panel h3{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin:22px 0 8px}
.panel h3:first-child{margin-top:0}
.meta{font-size:.82rem;color:var(--muted);margin:16px 0 6px}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:7px 0;border-bottom:1px solid var(--line);color:#d6d2e2;line-height:1.45}
ul.plain li:last-child{border-bottom:0}
ul.plain li em{font-style:normal;color:var(--muted)}
.stats{display:flex;gap:28px;margin:14px 0 4px}
.stats div{font-family:var(--serif);font-size:2rem;line-height:1}
.stats small{display:block;font-family:var(--sans);font-size:.75rem;color:var(--muted);margin-top:4px}
.dim{color:var(--muted)}

ul.rows{list-style:none;padding:0;margin:0}
ul.rows li{display:grid;grid-template-columns:7.5em 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);line-height:1.45;color:#d6d2e2}
ul.rows li:last-child{border-bottom:0}
ul.rows li span:first-child,.yb .y{font-family:var(--serif);font-size:1.05rem;color:var(--muted)}
.yb{display:grid;grid-template-columns:7.5em 1fr;gap:4px 14px;margin-top:8px}
.yb .y{padding-top:7px}
.yb ul.plain{margin-bottom:12px}
@media (max-width:480px){ul.rows li,.yb{grid-template-columns:1fr;gap:2px}.yb .y{padding-top:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

   ["Biography", `
     <p>Described by NPR's From the Top as “a young musician of extraordinary poise and expansive expression,” Angela Wang is a flutist, researcher, and student at Diamond Bar High School. She was selected as one of ten students nationally for NPR's From the Top Fellowship – Learning and Media Lab, where she conducted music and neuroimaging research with USC's Brain and Creativity Institute, sparking her long-term interest in developing cochlear implant technologies that preserve musical nuance for performers within her community. In 2026, Angela was named one of eight National Flute Association HS Solo Competition Finalists.</p>
     <p>At age 16, Angela debuted as a concerto soloist at Walt Disney Concert Hall, performing Doppler's Double Flute Concerto with the Los Angeles Youth Philharmonic Orchestra. She is a Jack Smith Memorial Award recipient of the Pasadena Showcase House for the Arts Instrumental Competition and a first-prize winner of the Bach, Pelican, World Stage, Southwestern, and Merano international competitions.</p>
     <p>In 2025 she was selected as one of four flutists for the New England Conservatory Youth Orchestra, and was the youngest flutist invited to Le Domaine Forget de Charlevoix. She has performed in advanced masterclasses with Karen Van Dyke, John Thorne, Aaron Goldman, Kathy Ransom, and Jim Walker, and will perform this summer for Emmanuel Pahud and Julien Beaudiment.</p>
     <p>A five-time California All-State musician, Angela has chaired each year as Principal Flute or Principal Piccolo — a rare sustained achievement — and served as Principal Flute of the LA Youth Philharmonic and Pacific Youth Symphony, debuting at Carnegie Hall in 2022.</p>`],

/* ---------- starfield ---------- */
const sky=document.getElementById('sky'),sx=sky.getContext('2d');let stars=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeSky(){const d=devicePixelRatio||1;sky.width=innerWidth*d;sky.height=innerHeight*d;sx.setTransform(d,0,0,d,0,0);
  const n=Math.round(innerWidth*innerHeight/2600);stars=[];const ang=-28*Math.PI/180;
  for(let i=0;i<n;i++){let x,y;
    if(Math.random()<.55){const t=(Math.random()-.5)*1.6*Math.max(innerWidth,innerHeight),o=(Math.random()+Math.random()+Math.random()-1.5)*innerHeight*.09;
      x=innerWidth/2+t*Math.cos(ang)-o*Math.sin(ang);y=innerHeight/2+t*Math.sin(ang)+o*Math.cos(ang);}
    else{x=Math.random()*innerWidth;y=Math.random()*innerHeight;}
    stars.push({x,y,r:Math.random()<.04?1.1:Math.random()*.7+.2,a:Math.random()*.6+.15,p:Math.random()*6.28,s:.3+Math.random()*.8});}
  drawSky(0);}
function drawSky(t){sx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){const a=reduce?s.a:s.a*(.75+.25*Math.sin(t/1000*s.s+s.p));sx.fillStyle=`rgba(236,232,250,${a})`;sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.283);sx.fill();}}
addEventListener('resize',sizeSky);sizeSky();
if(!reduce){(function loop(t){drawSky(t);requestAnimationFrame(loop)})(0);}

/* ---------- brain interaction ---------- */
const brain=document.getElementById('brain'),img=document.getElementById('brainImg'),glows=[...document.querySelectorAll('.glow')],
      label=document.getElementById('label'),halo=document.getElementById('halo'),nav=document.getElementById('nav');
document.documentElement.style.setProperty('--brain',`url(${img.src})`);

// alpha hit-test so only the brain itself is interactive
const hit=document.createElement('canvas'),hx=hit.getContext('2d',{willReadFrequently:true});let alphaReady=false;
function prepHit(){hit.width=img.naturalWidth;hit.height=img.naturalHeight;hx.drawImage(img,0,0);alphaReady=true;}
img.complete?prepHit():img.addEventListener('load',prepHit);

S.forEach((s,i)=>{const b=document.createElement('button');b.style.setProperty('--c',s.color);b.innerHTML=`<i></i>${s.name}`;
  b.addEventListener('mouseenter',()=>light(i));b.addEventListener('mouseleave',()=>light(-1));
  b.addEventListener('focus',()=>light(i));b.addEventListener('blur',()=>light(-1));
  b.addEventListener('click',()=>openPop(i,b));nav.appendChild(b);});
const navBtns=[...nav.children];

let cur=-1;
function regionAt(e){const r=brain.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;
  if(fx<0||fx>1||fy<0||fy>1)return -1;
  if(alphaReady){try{const a=hx.getImageData(Math.floor(fx*hit.width),Math.floor(fy*hit.height),1,1).data[3];if(a<30)return -1;}catch(_){}}
  return S.findIndex(s=>fy>=s.band[0]&&fy<s.band[1]);}
function light(i){if(i===cur)return;cur=i;
  glows.forEach((g,k)=>g.classList.toggle('on',k===i));navBtns.forEach((b,k)=>b.classList.toggle('on',k===i));
  brain.classList.toggle('active',i>-1);
  if(i>-1){const s=S[i];label.style.setProperty('--c',s.hex);label.querySelector('span').textContent=s.short;
    label.style.top=((s.band[0]+s.band[1])/2*100)+'%';label.classList.add('on');
    halo.style.background=s.hex;}
  else label.classList.remove('on');
  brain.style.cursor=i>-1?'pointer':'default';}
brain.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')light(regionAt(e))});
brain.addEventListener('pointerleave',()=>light(-1));
brain.addEventListener('click',e=>{const i=regionAt(e);if(i>-1){light(i);openPop(i,null);}});

/* ---------- popup ---------- */
const pop=document.getElementById('pop'),scrim=document.getElementById('scrim'),body=document.getElementById('popBody');let lastFocus=null;
function openPop(i,from){const s=S[i];lastFocus=from||document.activeElement;
  pop.style.setProperty('--glowc',s.hex);
  document.getElementById('popKicker').textContent=s.kicker;document.getElementById('popTitle').textContent=s.name;
  const multi=s.tabs.length>1;
  body.innerHTML=(multi?`<div class="tabs" role="tablist">${s.tabs.map((t,k)=>`<button role="tab" aria-selected="${k===0}" data-k="${k}">${t[0]}</button>`).join('')}</div>`:'')+
    `<div class="panel" role="tabpanel">${s.tabs[0][1]}</div>`;
  if(multi)body.querySelectorAll('[role=tab]').forEach(b=>b.addEventListener('click',()=>{
    body.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
    body.querySelector('.panel').innerHTML=s.tabs[+b.dataset.k][1];}));
  pop.scrollTop=0;pop.classList.add('open');scrim.classList.add('open');document.getElementById('close').focus();}
function closePop(){pop.classList.remove('open');scrim.classList.remove('open');light(-1);if(lastFocus&&lastFocus.focus)lastFocus.focus();}
document.getElementById('close').addEventListener('click',closePop);scrim.addEventListener('click',closePop);
addEventListener('keydown',e=>{if(e.key==='Escape'&&pop.classList.contains('open'))closePop();});
</script>
